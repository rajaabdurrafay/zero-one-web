name: Validate ZeroOne
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture-only-local
          MYSQL_DATABASE: zeroone_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pfixture-only-local"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://fixture:fixture@localhost:3306/fixture
      JWT_SECRET: fixture-only-jwt-key-for-database-free-ci-123456789
      REVALIDATE_SECRET: fixture-only-revalidation-key-123456789123456789
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: mysql://root:fixture-only-local@127.0.0.1:3306/zeroone_test_ci
      - run: npm run lint
      - run: npm run test:frontends
      - run: npm run audit:production
