name: Validate ZeroOne
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://fixture:fixture@localhost:3306/fixture
      JWT_SECRET: fixture-only-jwt-key-for-database-free-ci-123456789
      REVALIDATE_SECRET: fixture-only-revalidation-key-123456789123456789
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run test:frontends
      - run: npm run audit:production
